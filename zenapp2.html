<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenApp</title>
    <link href="css/tailwind.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1> 💰 ZenApp 💰</h1>
        <h5> your budget personal assistant </h5>
    </header>

    <main>
        <div class="m-4">
            // Radio Buttons for Income Frequency
            <fieldset class="mb-4">
                <legend class="block text-sm font-medium text-gray-700">Income Frequency:</legend>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input id="monthly" name="income-frequency" type="radio" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
                        <label for="monthly" class="ml-3 block text-sm font-medium text-gray-700">Monthly Income</label>
                    </div>
                    <div class="flex items-center">
                        <input id="yearly" name="income-frequency" type="radio" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
                        <label for="yearly" class="ml-3 block text-sm font-medium text-gray-700">Yearly Income</label>
                    </div>
                </div>
            </fieldset>
            
            // Text Field for Amount
            <div>
                <label for="textfield" class="block text-sm font-medium text-gray-700">Amount:</label>
            </div>
            <div>
                <input type="text" name="textfield" id="textfield" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            // Repeat for Expenses
            <div>
                <label for="textfield" class="block text-sm font-medium text-gray-700">Expenses:</label>
            </div>
            <div>
                <input type="text" name="textfield" id="textfield" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
        </div>
    </main>
    
</body>
</html>

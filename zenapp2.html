<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenApp</title>
    <link rel="stylesheet" href="tailwind.css">
</head>
<body class="body-styles">
    <header class="header-styles">
        <div class="container-styles">
            <h1 class="title">💰 ZenApp</h1>
            <h5 class="subtitle">Your Personal Budgeting Assistant</h5>
        </div>
    </header>

    <main class="main-container">
        <div class="form-container">
            <h2 class="form-title">Plan Your Budget</h2>
            <fieldset class="form-fieldset">
                <legend class="form-legend">Income Frequency:</legend>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input id="monthly" name="income-frequency" type="radio" class="radio-input" checked>
                        <label for="monthly" class="radio-label">Monthly Income</label>
                    </div>
                    <div class="flex items-center">
                        <input id="yearly" name="income-frequency" type="radio" class="radio-input">
                        <label for="yearly" class="radio-label">Yearly Income</label>
                    </div>
                </div>
            </fieldset>

            <div class="mt-4">
                <label for="priority-plan" class="form-label">Budgeting Priority:</label>
            </div>
            <div>
                <select id="priority-plan" class="form-input">
                    <option value="even" selected>Even Distribution</option>
                    <option value="10-45-35">10/45/35 Rule (Needs/Wants/Savings)</option>
                    <option value="50-30-20">50/30/20 Rule (Needs/Wants/Savings)</option>
                    <option value="60-30-10"> 60/30/10 Rule (Needs/Wants/Saving)</option>
                    <option value="90-5-5">90/5/5 Rule (Needs/Wants/Savings)</option>
                    <option value="savings-focused">Savings-Focused</option>
                </select>
            </div>
            
            <div class="mt-4">
                <label for="amount" class="form-label">Amount:</label>
            </div>
            <div>
                <input type="text" name="amount" id="amount" class="form-input">
            </div>

            <div class="mt-4">
                <label for="expenses" class="form-label">Monthly Expenses:</label>
            </div>
            <div>
                <input type="text" name="expenses" id="expenses" class="form-input" placeholder="$0.00">
            </div>

            <div class="mt-6">
                <button id="ai-help" class="ai-button">
                    Get AI Spending Help
                </button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="myPieChart" style="min-height:320px; width:100%; height:320px;"></canvas>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="./main.js"></script>
</body>
</html>

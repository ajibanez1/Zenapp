<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenApp</title>
    <link href="tailwind.css" rel="stylesheet">
</head>
<body class="body-styles">
    <header class="header-styles">
        <div class="container-styles">
            <h1 class="title">💰 ZenApp</h1>
            <h5 class="subtitle">Your Personal Budgeting Assistant</h5>
        </div>
    </header>

    <main class="main-container">
        <div class="form-container">
            <h2 class="form-title">Plan Your Budget</h2>
            <fieldset class="form-fieldset">
                <legend class="form-legend">Income Frequency:</legend>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input id="monthly" name="income-frequency" type="radio" class="radio-input">
                        <label for="monthly" class="radio-label">Monthly Income</label>
                    </div>
                    <div class="flex items-center">
                        <input id="yearly" name="income-frequency" type="radio" class="radio-input">
                        <label for="yearly" class="radio-label">Yearly Income</label>
                    </div>
                </div>
            </fieldset>

            <div class="mt-4">
                <label for="amount" class="form-label">Total Amount ($)</label>
                <input type="number" id="amount" class="form-input" placeholder="e.g., 50000">
            </div>

            <div class="mt-4">
                <label for="priority-plan" class="form-label">Budgeting Priority</label>
                <select id="priority-plan" class="form-input">
                    <option value="even">Even Distribution</option>
                    <option value="balanced">Balanced Plan</option>
                    <option value="savings-focused">Savings-Focused Plan</option>
                </select>
            </div>

            <div class="mt-6">
                <h3 class="form-legend">Monthly Expenses</h3>
                <form id="expense-form" class="expense-form">
                    <input type="text" id="expense-description" placeholder="Expense Name" class="form-input flex-grow">
                    <input type="number" id="expense-amount" placeholder="$0.00" class="form-input w-32" step="0.01">
                    <button type="submit" class="add-expense-button">+</button>
                </form>
            </div>

            <div id="expense-list-container" class="mt-4">
                <!-- Expenses will be listed here by JavaScript -->
            </div>

            <div class="mt-6">
                <button id="ai-help" class="ai-button">
                    Get AI Spending Help
                </button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="myPieChart"></canvas>
        </div>
    </main>

    <!-- AI Interaction Modal -->
    <div id="ai-modal" class="modal-overlay hidden">
        <div class="modal-container">
            <h3 class="modal-title">AI Budgeting Assistant</h3>
            <p class="modal-description">Tell me how you'd like to adjust your budget. For example: "Set Savings to 40% and Housing to 25%."</p>
            <textarea id="ai-input" class="modal-textarea" placeholder="Enter your command..."></textarea>
            <div class="modal-actions">
                <button id="ai-submit" class="modal-button-submit">Update Budget</button>
                <button id="ai-cancel" class="modal-button-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
